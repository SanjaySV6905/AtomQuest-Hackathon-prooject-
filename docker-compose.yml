version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: goalportal-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalportal-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/goalportal
      - JWT_SECRET=supersecretjwtkey2024goalportal
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:5173
      - NODE_ENV=development
      - PORT=5000
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goalportal-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
